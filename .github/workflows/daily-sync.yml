name: 每日同步飞书数据

# 天猫数据 T+1 出，生意参谋一般凌晨出全；这里定在北京时间 09:30（UTC 01:30）
# 触发已部署站点的 /api/sync，让服务端去飞书拉数并刷新缓存。
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 触发看板同步
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$DASHBOARD_URL" ] || [ -z "$SYNC_TOKEN" ]; then
            echo "缺少 DASHBOARD_URL 或 SYNC_TOKEN secret，跳过。"
            exit 1
          fi

          # 飞书偶发超时，退避重试三次
          for attempt in 1 2 3; do
            response=$(curl -sS -w '\n%{http_code}' -X POST \
              -H "Authorization: Bearer $SYNC_TOKEN" \
              "$DASHBOARD_URL/api/sync") && status=$(echo "$response" | tail -1) || status=000

            echo "$response" | sed '$d'

            if [ "$status" = "200" ]; then
              echo "同步成功。"
              exit 0
            fi

            echo "第 $attempt 次失败（HTTP $status），等待后重试…"
            sleep $((attempt * 10))
          done

          echo "三次尝试均失败。"
          exit 1
