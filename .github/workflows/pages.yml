name: 发布看板到 GitHub Pages

# 三种触发：改了看板就发一次、每天早上重新拉一次数、以及手点。
#
# 数据是**构建时**烤进 HTML 的（页面本身是纯静态单文件，不依赖任何后端），
# 所以「数据每天更新」靠的是每天重跑一次这个流程，而不是页面自己去请求接口。
on:
  push:
    branches: ['claude/tmall-dashboard-field-mapping-rdq5gr']
    paths:
      - 'preview/dashboard.html'
      - 'lib/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  schedule:
    # 北京时间 09:40（UTC 01:40）—— 比飞书那边出数晚十分钟
    - cron: '40 1 * * *'
  workflow_dispatch:

# 同一时间只跑一个部署，后来的把排队中的顶掉
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # 配了飞书 secrets 就现拉一次；没配就用仓库里已有的那份，构建照样成功
      - name: 生成静态页
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BASE_URL: ${{ secrets.FEISHU_BASE_URL }}
          FEISHU_WIKI_TOKEN: ${{ secrets.FEISHU_WIKI_TOKEN }}
          FEISHU_WIKI_TOKEN_KEYWORDS: ${{ secrets.FEISHU_WIKI_TOKEN_KEYWORDS }}
          FEISHU_SHEET_DAILY: ${{ secrets.FEISHU_SHEET_DAILY }}
          FEISHU_SHEET_CHANNELS: ${{ secrets.FEISHU_SHEET_CHANNELS }}
          FEISHU_SHEET_PRODUCTS: ${{ secrets.FEISHU_SHEET_PRODUCTS }}
          FEISHU_SHEET_CAMPAIGNS: ${{ secrets.FEISHU_SHEET_CAMPAIGNS }}
        run: npm run build:static

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
